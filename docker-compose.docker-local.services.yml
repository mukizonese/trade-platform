name: trade-platform-docker-local

services:
  trade-service:
    build:
      context: ./backend
      dockerfile: trade-service/Dockerfile
    profiles:
      - docker-local
    env_file:
      - .env.docker-local
    # Override port variables to use internal container ports for Docker-to-Docker communication
    # Host ports (from .env.docker-local) remain different for flexibility
    environment:
      TZ: UTC
      MYSQL_PORT: 3306  # Internal container port (host port can be different)
      MONGO_PORT: 27017  # Internal container port (host port can be different)
      REDIS_PORT: 6379  # Internal container port (host port can be different)
      VECTOR_DB_PORT: 8000  # Internal container port (host port can be different)
      KAFKA_BOOTSTRAP_SERVERS: kafka:29093  # Internal container port
    # Ports removed to allow scaling - access via nginx load balancer or gateway service
    # For direct access, use: docker exec -it <container> or access via nginx:8092 or gateway:8090
    networks:
      - trade-net-local
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8093/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    deploy:
      replicas: 1

  nginx-trade-service:
    image: nginx:alpine
    container_name: trade-nginx-trade-service-local
    profiles:
      - docker-local
    volumes:
      - ./nginx-trade-service.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${TRADE_SERVICE_PORT:-8092}:80"
    depends_on:
      trade-service:
        condition: service_healthy
    networks:
      - trade-net-local
    healthcheck:
      # Check if nginx is responding and can proxy to trade-service
      # Using curl which is available in nginx:alpine
      # start_period gives nginx time to start and trade-service to be ready
      test: ["CMD-SHELL", "curl -f -s http://localhost/actuator/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  trade-ingress-service:
    build:
      context: ./backend
      dockerfile: trade-ingress-service/Dockerfile
    container_name: trade-ingress-service-local
    profiles:
      - docker-local
    env_file:
      - .env.docker-local
    # Override port variables to use internal container ports for Docker-to-Docker communication
    environment:
      REDIS_PORT: 6379
      # Route through nginx load balancer instead of directly to trade-service
      TRADE_SERVICE_URL: http://nginx-trade-service:80
    depends_on:
      nginx-trade-service:
        condition: service_healthy
    ports:
      - "${INGRESS_PORT:-8092}:8092"
    networks:
      - trade-net-local
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8092/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    deploy:
      replicas: 1

  trade-gateway-service:
    build:
      context: ./backend
      dockerfile: trade-gateway-service/Dockerfile
    container_name: trade-gateway-service-local
    profiles:
      - docker-local
    env_file:
      - .env.docker-local
    # Override port variables to use internal container ports for Docker-to-Docker communication
    environment:
      REDIS_PORT: 6379
    depends_on:
      trade-service:
        condition: service_healthy
      trade-ingress-service:
        condition: service_healthy      
    ports:
      - "${GATEWAY_PORT:-8091}:8091"
    networks:
      - trade-net-local
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8091/actuator/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    deploy:
      replicas: 1

  trade-ai-service:
    build:
      context: ./backend
      dockerfile: trade-ai-service/Dockerfile
    container_name: trade-ai-service-local
    profiles:
      - docker-local
    env_file:
      - .env.docker-local
    environment:
      TZ: UTC
      VECTOR_DB_HOST: chroma
      VECTOR_DB_PORT: 8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:29093
    ports:
      - "${TRADE_AI_SERVICE_PORT:-8094}:8094"
    networks:
      - trade-net-local
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8094/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    deploy:
      replicas: 1

  trade-ui:
    build:
      context: ./frontend/trade-ui
      dockerfile: Dockerfile.dev
    container_name: trade-ui-local
    profiles:
      - docker-local
    env_file:
      - .env.docker-local
    depends_on:
      trade-gateway-service:
        condition: service_healthy
      trade-ingress-service:
        condition: service_healthy
      nginx-trade-service:
        condition: service_healthy     
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8091}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - trade-net-local
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

networks:
  trade-net-local:
    external: true
    name: trade-platform-docker-local_trade-net-local

