name: trade-platform-docker-local

services:
  mysql:
    image: mysql:8.4
    container_name: trade-mysql-local
    profiles:
      - docker-local
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data_local:/var/lib/mysql
      - ./conf.d:/etc/mysql/conf.d:ro
      - ./infra/db-init-scripts:/docker-entrypoint-initdb.d
    networks:
      - trade-net-local
    healthcheck:
      #test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p${MYSQL_ROOT_PASSWORD} | grep -q 'mysqld is alive'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: trade-mongo-local
    profiles:
      - docker-local
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data_local:/data/db
    networks:
      - trade-net-local
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
        tag: "{{.Name}}"

  redis:
    image: redis/redis-stack:latest
    container_name: trade-redis-local
    profiles:
      - docker-local
    ports:
      - "${REDIS_PORT}:6379"
      - "${REDIS_PORT_GUI}:8001"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_ARGS: >-
        --requirepass ${REDIS_PASSWORD}
        --dir /data
        --appendonly yes
        --appendfsync everysec
        --save 3600 1
        --save 300 100
        --save 60 10000
    volumes:
      - redis_data_local:/data
    networks:
      - trade-net-local
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: trade-zookeeper-local
    profiles:
      - docker-local
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_PORT}
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_LOG4J_LOGGERS: org.apache.zookeeper.server.NIOServerCnxn=ERROR
    ports:
      - "${ZOOKEEPER_PORT}:2181"
    volumes:
      - zookeeper_data_local:/var/lib/zookeeper/data
      - zookeeper_logs_local:/var/lib/zookeeper/log
    networks:
      - trade-net-local
    healthcheck:
      test: nc -z localhost ${ZOOKEEPER_PORT} || exit -1
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
        tag: "{{.Name}}"

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: trade-kafka-local
    profiles:
      - docker-local
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_PORT}
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx10g"
    ports:
      - "${KAFKA_PORT}:9092"
    networks:
      - trade-net-local
    volumes:
      - kafka_data_local:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    container_name: trade-chroma-local
    profiles:
      - docker-local
    ports:
      - "${VECTOR_DB_PORT}:8000"
    volumes:
      - chroma_data_local:/chroma/chroma
    networks:
      - trade-net-local
    healthcheck:
      #test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat | grep -q 'ChromaDB is running'"]
      #test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      #test: ["CMD-SHELL", "curl -fsS http://localhost:8009/api/v2/heartbeat | grep -q 'ChromaDB is running' || exit 1"]
      # test:
      #   [
      #     "CMD-SHELL",
      #     "python3 -c \"import urllib.request,sys; resp=urllib.request.urlopen('http://localhost:8000/api/v2/heartbeat'); sys.exit(0 if resp.getcode()==200 else 1)\""
      #   ]
      test: ["CMD-SHELL", "python3 -c 'import sys; sys.exit(0)' || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: trade-blackbox-exporter-local
    profiles:
      - docker-local
    networks:
      - trade-net-local
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: trade-prometheus-local
    profiles:
      - docker-local
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_local:/prometheus
    networks:
      - trade-net-local
    depends_on:
      - blackbox-exporter
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: trade-grafana-local
    profiles:
      - docker-local
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data_local:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - trade-net-local
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data_local:
  mongo_data_local:
  redis_data_local:
  zookeeper_data_local:
  zookeeper_logs_local:
  kafka_data_local:
  chroma_data_local:
  prometheus_data_local:
  grafana_data_local:
networks:
  trade-net-local:
    driver: bridge

