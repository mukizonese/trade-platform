# Resolver for dynamic DNS resolution (Docker Compose DNS)
# Docker Compose uses 127.0.0.11 as its internal DNS resolver
# valid=1s means DNS cache is valid for only 1 second, forcing frequent re-resolution
resolver 127.0.0.11 valid=1s ipv6=off;

server {
    listen 80;
    server_name _;
    
    # Increase timeouts for long-running requests
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Buffer settings
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    
    # Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # CRITICAL: Use variable in proxy_pass to force DNS re-resolution on each request
    # Without a variable, nginx resolves DNS once and caches it
    # With a variable, nginx resolves DNS per request using the resolver above
    # Note: Port must match TRADE_SERVICE_PORT from .env.docker-local (default: 8093)
    set $backend_upstream "http://trade-service:8093";
    
    # Disable keepalive to force new connections (helps with load balancing)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    
    # Health check endpoint
    location /actuator/health {
        proxy_pass $backend_upstream;
        access_log off;
    }
    
    # All other requests
    location / {
        # Variable forces DNS re-resolution on each request
        # Docker Compose DNS returns different instance IPs in round-robin
        proxy_pass $backend_upstream;
        
        # Add X-Forwarded-Host to help with debugging
        proxy_set_header X-Forwarded-Host $host;
        
        # WebSocket support (if needed in future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

