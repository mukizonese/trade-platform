spring:
  application:
    name: trade-ingress-service
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${INGRESS_PORT:8081}

management:
  server:
    port: ${INGRESS_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,ratelimiters
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true

logging:
  level:
    root: WARN
    org.springframework.web: WARN
    org.springframework.web.servlet.resource.NoResourceFoundException: OFF
    org.springframework.boot: WARN
    com.tradeplatform: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

api:
  paths:
    trades: ${API_PATH_TRADES:/api/trades}
    cache: ${API_PATH_CACHE:/api/trades/cache}
    audit: ${API_PATH_AUDIT:/api/audit}

resilience4j:
  circuitbreaker:
    instances:
      tradeService:
        registerHealthIndicator: true
        minimumNumberOfCalls: ${CIRCUIT_BREAKER_MINIMUM_NUMBER_OF_CALLS}
        slidingWindowSize: ${CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE}
        failureRateThreshold: ${CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD}
        waitDurationInOpenState: ${CIRCUIT_BREAKER_WAIT_DURATION_IN_OPEN_STATE}
  ratelimiter:
    instances:
      submitTrade:
        limitForPeriod: ${RATE_LIMIT_LIMIT_FOR_PERIOD}
        limitRefreshPeriod: ${RATE_LIMIT_REFRESH_PERIOD}
        timeoutDuration: ${RATE_LIMIT_TIMEOUT_DURATION}
        registerHealthIndicator: true

