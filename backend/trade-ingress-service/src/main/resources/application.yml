spring:
  application:
    name: trade-ingress-service
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${INGRESS_PORT:8081}

management:
  server:
    port: ${INGRESS_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: WARN
    org.springframework.web: WARN
    org.springframework.boot: WARN
    com.tradeplatform: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

api:
  paths:
    trades: ${API_PATH_TRADES:/api/trades}
    cache: ${API_PATH_CACHE:/api/trades/cache}
    audit: ${API_PATH_AUDIT:/api/audit}

