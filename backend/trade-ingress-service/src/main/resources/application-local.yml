trade:
  service:
    url: ${TRADE_SERVICE_URL:http://localhost:8080}

api:
  paths:
    trades: ${API_PATH_TRADES:/api/trades}
    cache: ${API_PATH_CACHE:/api/trades/cache}
    audit: ${API_PATH_AUDIT:/api/audit}

# Note: CORS is handled at the Gateway level (port 8090)
# No CORS configuration needed here since all requests go through gateway

