spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT}/${MYSQL_DATABASE:trade_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USERNAME:trade_user}
    password: ${MYSQL_PASSWORD:trade_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  data:
    mongodb:
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DATABASE:trade_audit_db}
      username: ${MONGO_USERNAME:}
      password: ${MONGO_PASSWORD:}
      authentication-database: admin
  
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: tradeEvent:com.tradeplatform.tradeservice.kafka.TradeEvent
    consumer:
      group-id: trade-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: tradeEvent:com.tradeplatform.tradeservice.kafka.TradeEvent
        spring.json.trusted.packages: "*"

trade:
  kafka:
    topics:
      trade-events: ${KAFKA_TOPIC_TRADE_EVENTS:trade-events}
      trade-reports: ${KAFKA_TOPIC_TRADE_REPORTS:trade-reports}
  
  vector-db:
    host: ${VECTOR_DB_HOST:localhost}
    port: ${VECTOR_DB_PORT:8000}
    collection: ${VECTOR_DB_COLLECTION:trade_reports}
  
  cache:
    ttl:
      trade-latest: 30
      dashboard-summary: 10
      dashboard-by-book: 10
      dashboard-by-counterparty: 10

