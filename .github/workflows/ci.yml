name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-vulnerability-scan:
    name: Backend Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Run OWASP Dependency Check
        working-directory: ./backend/trade-service
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7.0 \
            -Dformat=ALL \
            -DskipProvidedScope=true \
            -DskipRuntimeScope=false
        continue-on-error: false
      
      - name: Upload OWASP Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-owasp-report
          path: backend/trade-service/target/dependency-check-report.*
          retention-days: 30

  backend-build-test:
    name: Backend Build and Test
    runs-on: ubuntu-latest
    needs: backend-vulnerability-scan
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: trade_db
          MYSQL_USER: trade_user
          MYSQL_PASSWORD: trade_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      
      # Note: Kafka is managed by Testcontainers in integration tests
      # This service is optional but can be used for manual testing
      # Testcontainers will spin up its own Kafka container for tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Run unit tests
        working-directory: ./backend/trade-service
        run: mvn clean test -Dtest=*Test
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_DATABASE: trade_db
          MYSQL_USERNAME: trade_user
          MYSQL_PASSWORD: trade_password
          MONGO_HOST: localhost
          MONGO_PORT: 27017
          MONGO_DATABASE: trade_audit_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_PROFILES_ACTIVE: local
      
      - name: Run integration tests
        working-directory: ./backend/trade-service
        run: mvn test -Dtest=*IntegrationTest
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_DATABASE: trade_db
          MYSQL_USERNAME: trade_user
          MYSQL_PASSWORD: trade_password
          MONGO_HOST: localhost
          MONGO_PORT: 27017
          MONGO_DATABASE: trade_audit_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_PROFILES_ACTIVE: local
      
      - name: Build application
        working-directory: ./backend/trade-service
        run: mvn clean package -DskipTests
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_DATABASE: trade_db
          MYSQL_USERNAME: trade_user
          MYSQL_PASSWORD: trade_password
          MONGO_HOST: localhost
          MONGO_PORT: 27017
          MONGO_DATABASE: trade_audit_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_PROFILES_ACTIVE: local
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/trade-service/target/surefire-reports/
          retention-days: 7

  frontend-vulnerability-scan:
    name: Frontend Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/trade-ui/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend/trade-ui
        run: npm ci
      
      - name: Run npm audit (fail on critical/high vulnerabilities)
        working-directory: ./frontend/trade-ui
        run: |
          # Run audit and check for critical/high vulnerabilities
          npm audit --audit-level=high --production || {
            echo "❌ Critical or High severity vulnerabilities detected!"
            echo "Please review and fix vulnerabilities before proceeding."
            exit 1
          }
        continue-on-error: false
      
      - name: Generate npm audit JSON report
        if: always()
        working-directory: ./frontend/trade-ui
        run: npm audit --json > npm-audit-report.json || true
        continue-on-error: true
      
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-audit-report
          path: frontend/trade-ui/npm-audit-report.json
          retention-days: 30

  frontend-build-test:
    name: Frontend Build and Test
    runs-on: ubuntu-latest
    needs: frontend-vulnerability-scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/trade-ui/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend/trade-ui
        run: npm ci
      
      - name: Run linter
        working-directory: ./frontend/trade-ui
        run: npm run lint
      
      - name: Run unit tests
        working-directory: ./frontend/trade-ui
        run: npm test -- --passWithNoTests --coverage || true
      
      - name: Build application
        working-directory: ./frontend/trade-ui
        run: npm run build
      
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/trade-ui/.next
          retention-days: 7
          if-no-files-found: ignore

  regression-test-summary:
    name: Regression Test Summary
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download backend test results
        uses: actions/download-artifact@v4
        with:
          name: backend-test-results
          path: backend-test-results/
      
      - name: Generate test summary
        run: |
          echo "## Regression Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.backend-build-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.frontend-build-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Vulnerability Scans" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ needs.backend-vulnerability-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ needs.frontend-vulnerability-scan.result }}" >> $GITHUB_STEP_SUMMARY

