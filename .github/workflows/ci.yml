name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-vulnerability-scan:
    name: Backend Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Cache OWASP Data
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: owasp-data-${{ runner.os }}-v1
          restore-keys: |
            owasp-data-${{ runner.os }}-
      
      - name: Check if OWASP database exists
        id: check-db
        run: |
          if [ -d "$HOME/.dependency-check/data" ] && [ "$(find $HOME/.dependency-check/data -type f 2>/dev/null | head -1)" ]; then
            echo "database_exists=true" >> $GITHUB_OUTPUT
            echo "✅ OWASP database found in cache"
          else
            echo "database_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ OWASP database not found in cache"
          fi
      
      - name: Install all modules (build parent and dependencies)
        working-directory: ./backend
        run: mvn clean install -DskipTests -Ddependency-check.skip=true
      
      - name: Run OWASP Dependency Check
        id: owasp-scan
        working-directory: ./backend/trade-service
        continue-on-error: ${{ steps.check-db.outputs.database_exists != 'true' }}
        run: |
          if [ "${{ steps.check-db.outputs.database_exists }}" == "true" ]; then
            echo "✅ Using cached OWASP database (skipping NVD update to avoid CVSS v4 parsing error)..."
            # Use cached data - skip update to avoid CVSS v4 parsing error
            mvn org.owasp:dependency-check-maven:check \
              -DfailBuildOnCVSS=7.0 \
              -Dformat=ALL \
              -DskipProvidedScope=true \
              -DskipRuntimeScope=false \
              -DnvdValidForHours=999999 \
              -DcveValidForHours=999999 \
              -DcveStartYear=2020 \
              -DautoUpdate=false
          else
            echo "⚠️ No cached database found. This is the first run."
            echo "⚠️ Attempting to create database (may fail due to CVSS v4 parsing issue in OWASP 10.0.4)..."
            echo "⚠️ If this fails, the build will continue but vulnerability scan will be skipped."
            echo "⚠️ Subsequent runs will use cached data and should work."
            # First run: Try to create database
            # If it fails due to CVSS v4 bug, continue-on-error will allow build to proceed
            mvn org.owasp:dependency-check-maven:check \
              -DfailBuildOnCVSS=7.0 \
              -Dformat=ALL \
              -DskipProvidedScope=true \
              -DskipRuntimeScope=false \
              -DcveStartYear=2020 \
              -DnvdValidForHours=720 \
              -DcveValidForHours=0
          fi
      
      - name: Report OWASP scan status
        if: always()
        run: |
          if [ "${{ steps.owasp-scan.outcome }}" == "failure" ] && [ "${{ steps.check-db.outputs.database_exists }}" != "true" ]; then
            echo "::warning::OWASP vulnerability scan skipped on first run due to database creation failure (CVSS v4 parsing bug in OWASP 10.0.4). Subsequent runs will use cached data."
          elif [ "${{ steps.owasp-scan.outcome }}" == "success" ]; then
            echo "✅ OWASP vulnerability scan completed successfully"
          fi
      
      - name: Upload OWASP Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-owasp-report
          path: backend/trade-service/target/dependency-check-report.*
          retention-days: 30

  backend-build-test:
    name: Backend Build and Test
    runs-on: ubuntu-latest
    needs: backend-vulnerability-scan
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: trade_db
          MYSQL_USER: trade_user
          MYSQL_PASSWORD: trade_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      
      # Note: Kafka is managed by Testcontainers in integration tests
      # This service is optional but can be used for manual testing
      # Testcontainers will spin up its own Kafka container for tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Install all modules (build parent and dependencies)
        working-directory: ./backend
        run: mvn clean install -DskipTests -Ddependency-check.skip=true
      
      - name: Run unit tests
        working-directory: ./backend/trade-service
        run: mvn clean test -Dtest=*Test
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_DATABASE: trade_db
          MYSQL_USERNAME: trade_user
          MYSQL_PASSWORD: trade_password
          MONGO_HOST: localhost
          MONGO_PORT: 27017
          MONGO_DATABASE: trade_audit_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_PROFILES_ACTIVE: local
      
      - name: Run integration tests
        working-directory: ./backend/trade-service
        run: mvn test -Dtest=*IntegrationTest
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_DATABASE: trade_db
          MYSQL_USERNAME: trade_user
          MYSQL_PASSWORD: trade_password
          MONGO_HOST: localhost
          MONGO_PORT: 27017
          MONGO_DATABASE: trade_audit_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_PROFILES_ACTIVE: local
      
      - name: Prepare and check test reports
        if: always()
        working-directory: ./backend/trade-service
        run: |
          # Ensure directory exists
          mkdir -p target/surefire-reports
          
          # Check for XML test reports
          XML_COUNT=$(find target/surefire-reports -name "*.xml" 2>/dev/null | wc -l | tr -d ' ')
          
          if [ "$XML_COUNT" -eq 0 ]; then
            echo "⚠️ No Surefire XML test reports found in target/surefire-reports/"
            echo "Checking for test output in other locations..."
            
            # Check if target directory exists at all
            if [ -d "target" ]; then
              echo "Target directory structure:"
              find target -type d -maxdepth 2 2>/dev/null | head -10 || true
              echo ""
              echo "Looking for any test-related files:"
              find target -name "*test*" -o -name "*Test*" 2>/dev/null | head -10 || true
            fi
            
            # Create a summary file explaining the situation
            {
              echo "Test Execution Summary"
              echo "======================"
              echo "Tests were executed but no Surefire XML reports were found."
              echo ""
              echo "Possible reasons:"
              echo "1. Tests completed but didn't generate XML reports"
              echo "2. Tests use a different reporting format"
              echo "3. Reports are generated in a different location"
              echo "4. Test execution was skipped or had issues"
              echo ""
              echo "This is a warning, not an error. The build will continue."
            } > target/surefire-reports/test-summary.txt
            echo ""
            echo "Created summary file: target/surefire-reports/test-summary.txt"
          else
            echo "✅ Found $XML_COUNT Surefire XML test report file(s)"
            echo "Report files:"
            find target/surefire-reports -name "*.xml" 2>/dev/null | head -5
          fi
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/trade-service/target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn
      
      - name: Build application
        working-directory: ./backend/trade-service
        run: mvn clean package -DskipTests -Ddependency-check.skip=true
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_DATABASE: trade_db
          MYSQL_USERNAME: trade_user
          MYSQL_PASSWORD: trade_password
          MONGO_HOST: localhost
          MONGO_PORT: 27017
          MONGO_DATABASE: trade_audit_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_PROFILES_ACTIVE: local

  frontend-vulnerability-scan:
    name: Frontend Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/trade-ui/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend/trade-ui
        run: npm ci
      
      - name: Run npm audit (fail on critical/high vulnerabilities)
        working-directory: ./frontend/trade-ui
        run: |
          # Run audit and check for critical/high vulnerabilities
          npm audit --audit-level=high --production || {
            echo "❌ Critical or High severity vulnerabilities detected!"
            echo "Please review and fix vulnerabilities before proceeding."
            exit 1
          }
        continue-on-error: false
      
      - name: Generate npm audit JSON report
        if: always()
        working-directory: ./frontend/trade-ui
        run: npm audit --json > npm-audit-report.json || true
        continue-on-error: true
      
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-audit-report
          path: frontend/trade-ui/npm-audit-report.json
          retention-days: 30

  frontend-build-test:
    name: Frontend Build and Test
    runs-on: ubuntu-latest
    needs: frontend-vulnerability-scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/trade-ui/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend/trade-ui
        run: npm ci
      
      - name: Run linter
        working-directory: ./frontend/trade-ui
        run: npm run lint
      
      - name: Run unit tests
        working-directory: ./frontend/trade-ui
        run: npm test -- --passWithNoTests --coverage || true
      
      - name: Build application
        working-directory: ./frontend/trade-ui
        run: npm run build
      
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/trade-ui/.next
          retention-days: 7
          if-no-files-found: ignore

  regression-test-summary:
    name: Regression Test Summary
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download backend test results
        uses: actions/download-artifact@v4
        with:
          name: backend-test-results
          path: backend-test-results/
          if-no-files-found: ignore
        continue-on-error: true
      
      - name: Generate test summary
        run: |
          echo "## Regression Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.backend-build-test.result }}" >> $GITHUB_STEP_SUMMARY
          if [ -d "backend-test-results" ] && [ "$(ls -A backend-test-results 2>/dev/null)" ]; then
            echo "- Test Reports: ✅ Available" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Test Reports: ⚠️ Not available (tests may not have generated reports)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.frontend-build-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Vulnerability Scans" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ needs.backend-vulnerability-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ needs.frontend-vulnerability-scan.result }}" >> $GITHUB_STEP_SUMMARY

